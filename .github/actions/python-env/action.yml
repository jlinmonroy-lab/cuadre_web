name: Entorno de Python
description: Python 3.12 con las dependencias de contratos y del backend (extra dev). Equivale a los pasos de «Puesta en marcha» del README.

runs:
  using: composite
  steps:
    - name: Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          contracts/requirements.txt
          backend/pyproject.toml

    - name: Dependencias de Python
      shell: bash
      run: |
        pip install -r contracts/requirements.txt
        pip install -e "backend[dev]"
