# CI de cuadre-web (SPEC-W-001 §3.5 y §8.2, ADR-0010). Cada trabajo repite en un runner limpio la parte que corresponde de la secuencia de §8.2.
#
# Requisito obligatorio de fusión: «RLS (NFR-06)» (NFR-06 como puerta de despliegue). Al crear el repositorio en GitHub hay que proteger `main`
# y marcarlo como comprobación obligatoria (README, «Integración continua»). Los demás trabajos son recomendados.
#
# Sin filtros de ruta a propósito: un check obligatorio que no se dispara deja el PR bloqueado, y la puerta RLS debe correr siempre.
# Sin secretos de repositorio: todo lo que se necesita sale de la pila efímera de Supabase. Las actions de terceros van fijadas por SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: "Python: estilo y deriva"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Estilo (ruff)
        run: |
          ruff check backend contracts/tools contracts/python
          ruff format --check backend contracts/tools contracts/python
      - name: Deriva de contratos y de OpenAPI
        run: |
          python contracts/tools/export_schemas.py --check
          python contracts/tools/validate_examples.py
          python backend/scripts/export_openapi.py --check

  rls:
    name: "RLS (NFR-06)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - uses: ./.github/actions/local-stack
      - name: Aislamiento por rol
        run: pytest backend/tests/rls -m rls -q

  backend:
    name: "Backend: API y reglas"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - uses: ./.github/actions/local-stack
      - name: API y guardas de reglas
        run: pytest backend/tests -m "not rls" -q

  frontend:
    name: "Frontend: calidad y build"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm --prefix frontend ci
      - name: Calidad
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test:unit
          npm run test:scripts
          npm --prefix frontend run gen:api -- --check
      # El build solo necesita las variables públicas: basta la plantilla, con marcadores de posición.
      - name: Variables públicas de marcadores
        run: cp frontend/.env.example frontend/.env.local
      - name: Build y comprobación de fugas
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run check:bundle

  e2e:
    name: "E2E: Playwright"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - uses: ./.github/actions/local-stack
      - name: Dependencias del frontend
        run: npm --prefix frontend ci
      - name: Navegadores de Playwright
        run: npm --prefix frontend exec -- playwright install --with-deps chromium firefox webkit
      - name: Pruebas de extremo a extremo
        run: npm --prefix frontend run test:e2e
      - name: Informe de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
