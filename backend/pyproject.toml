[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuadre-backend"
version = "0.1.0"
description = "API de cuadre-web: FastAPI, lógica fiscal determinista, jobs y servidor MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "psycopg[binary]==3.3.7",
  "psycopg-pool==3.3.3",
  "PyJWT[crypto]==2.15.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "rls: aislamiento por rol contra la pila local de Supabase (NFR-06, puerta de despliegue)",
  "live: usa tokens reales emitidos por GoTrue",
  "pooler: pasa por el pooler en modo transacción",
]
