[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuadre-backend"
version = "0.1.0"
description = "API de cuadre-web: FastAPI, lógica fiscal determinista, jobs y servidor MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "psycopg[binary]==3.3.7",
  "psycopg-pool==3.3.3",
  "PyJWT[crypto]==2.15.1",
  "httpx2==2.16.0",
  # Contratos con cuadre-agents (contracts/python). No está en PyPI: se instala antes, `pip install -e contracts/python`.
  "cuadre-contracts==1.0.0",
  # NIF y NIF-IVA de la UE (SPEC-W-003). Sin extras: `zeep`, que usa la consulta a VIES, no entra (nada sale a la red, Anexo B.1).
  "python-stdnum==2.2",
  # `zoneinfo` necesita la base de zonas horarias en Windows (Europe/Madrid); hoy solo la trae psycopg.
  "tzdata==2026.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.4",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "rls: aislamiento por rol contra la pila local de Supabase (NFR-06, puerta de despliegue)",
  "live: usa tokens reales emitidos por GoTrue",
  "pooler: pasa por el pooler en modo transacción",
]
