# Matriz de RLS de cuadre-web (SPEC-W-001 §5.2.4 y §8.3). Es el registro que vigila `test_rls_guard`:
# toda tabla de `public` debe figurar aquí. Cada spec que añada una tabla la añade a este archivo.
#
# Reparto de cada test (cinco usuarios nuevos):
#   alicia, beto = usuario · gina, gus = gestor · adan = admin
# Estados del vínculo Alicia -> Gina (`scenarios`):
#   baseline (sin vínculo) · pending · active · revoked · declined
#
# `seed` (opcional): sentencia SQL que se ejecuta con privilegios de administrador una vez por cada `usuario` del reparto
# (alicia y beto; parámetro `%(owner)s`) antes de comparar lo que ve cada persona. Las tablas que no se rellenan solas lo necesitan.
#
# `select`: para cada persona, los DUEÑOS (por clave del reparto) de las filas que ve. `default` vale para todos los estados
# y cada estado solo lista lo que cambia. `all` = todas las cuentas del reparto (y quizá más: el administrador ve metadatos de
# cuentas de otros tests).
version: 1

scenarios: [baseline, pending, active, revoked, declined]

tables:
  profiles:
    kind: identity
    owner_column: id
    grants:                 # privilegios de `authenticated` (el resto de roles de aplicación no tiene ninguno)
      table: [SELECT]
      columns:
        UPDATE: [display_name]
    probe_insert: "insert into public.profiles (id, email) values (%(owner)s, %(email)s)"
    probe_update: { column: display_name, value: hacked }
    select:
      default: { alicia: [alicia], beto: [beto], gina: [gina], gus: [gus], adan: all }
      active: { gina: [gina, alicia] }

  business_profiles:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]
      columns:
        # `logo_path` ya no se escribe directamente (SPEC-W-005 D-13): lo cambian app.set_business_logo y app.clear_business_logo.
        UPDATE: [legal_name, tax_id, fiscal_address, activity, iae_epigraph, activity_start_date, vat_regime, irpf_rate, iban, home_pct]
    probe_insert: "insert into public.business_profiles (owner_id) values (%(owner)s)"
    probe_update: { column: legal_name, value: hacked }
    select:
      # Toda cuenta tiene su ficha (la crea el trigger de alta) y su dueño la ve; el administrador ve la suya, NUNCA la de otro (D3).
      default: { alicia: [alicia], beto: [beto], gina: [gina], gus: [gus], adan: [adan] }
      active: { gina: [gina, alicia] }

  gestor_access:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]
      columns:
        INSERT: [owner_id, gestor_email]
    probe_insert: "insert into public.gestor_access (owner_id, gestor_email) values (%(owner)s, %(email)s)"
    probe_update: { column: status, value: revoked }
    select:
      default: { alicia: [], beto: [], gina: [], gus: [], adan: [] }
      pending: { alicia: [alicia], gina: [alicia] }
      active: { alicia: [alicia], gina: [alicia] }
      revoked: { alicia: [alicia], gina: [alicia] }
      declined: { alicia: [alicia], gina: [alicia] }

  activity_log:
    kind: log
    owner_column: owner_id
    grants:
      table: [SELECT]
    probe_insert: "insert into public.activity_log (category, action) values ('data', 'forged')"
    probe_update: { column: action, value: forged }
    select:
      # Todo alta registra «account.created» (categoría account, sin actor): cada persona ve el suyo y el administrador, todos.
      default: { alicia: [alicia], beto: [beto], gina: [gina], gus: [gus], adan: all }
      # Gina actúa al aceptar o rechazar: ve su propia acción sobre la cuenta de Alicia.
      active: { gina: [gina, alicia] }
      revoked: { gina: [gina, alicia] }
      declined: { gina: [gina, alicia] }

  documents:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.* (SPEC-W-002 §5.2)
    # Una fila por usuario del reparto (alicia, beto) antes de comparar: con la tabla vacía la prueba no demostraría nada.
    seed: >-
      insert into public.documents (id, owner_id, source, original_filename, mime_type, size_bytes, storage_path)
      select d.id, %(owner)s, 'file', 'matriz.pdf', 'application/pdf', 10, %(owner)s::text || '/' || d.id::text || '.pdf'
      from (select gen_random_uuid() as id) d
    probe_insert: "insert into public.documents (owner_id, source, original_filename, mime_type, size_bytes, storage_path) values (%(owner)s, 'file', 'x.pdf', 'application/pdf', 10, 'x')"
    probe_update: { column: error_code, value: hacked }
    select:
      # El dueño ve la suya; el gestor, solo la de quien le dio acceso activo; el administrador, ninguna (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  expenses:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.* (SPEC-W-003 §5.2)
    # Un gasto manual por usuario del reparto antes de comparar: con la tabla vacía la prueba no demostraría nada.
    seed: >-
      insert into public.expenses (owner_id, origin, expense_date, supplier_name, category, base_cents, vat_cents, total_cents, deductible_vat)
      values (%(owner)s, 'manual', date '2026-10-01', 'Matriz', 'software', 100, 0, 100, false)
    probe_insert: "insert into public.expenses (owner_id, origin, expense_date, supplier_name, category, base_cents, vat_cents, total_cents, deductible_vat) values (%(owner)s, 'manual', date '2026-10-01', 'x', 'other', 1, 0, 1, false)"
    probe_update: { column: supplier_name, value: hacked }
    select:
      # El dueño ve el suyo; el gestor, solo el de quien le dio acceso activo; el administrador, ninguno (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  invoice_series:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.* (SPEC-W-005 §5.2)
    # Una serie por usuario del reparto antes de comparar: con la tabla vacía la prueba no demostraría nada.
    seed: >-
      insert into public.invoice_series (owner_id, code, description, is_default)
      values (%(owner)s, 'MTX', 'Matriz', true)
    probe_insert: "insert into public.invoice_series (owner_id, code) values (%(owner)s, 'PRB')"
    probe_update: { column: description, value: hacked }
    select:
      # El dueño ve las suyas; el gestor, solo las de quien le dio acceso activo; el administrador, ninguna (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  clients:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.* (SPEC-W-006 §5.2)
    # Un cliente por usuario del reparto antes de comparar: con la tabla vacía la prueba no demostraría nada.
    seed: >-
      insert into public.clients (owner_id, name, kind, country, scope)
      values (%(owner)s, 'Matriz S.L.', 'business', 'ES', 'national')
    probe_insert: "insert into public.clients (owner_id, name, kind, country, scope) values (%(owner)s, 'Probe S.L.', 'business', 'ES', 'national')"
    probe_update: { column: name, value: hacked }
    select:
      # El dueño ve los suyos; el gestor, solo los de quien le dio acceso activo; el administrador, ninguno (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  gestor_notes:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.add_gestor_note (SPEC-W-010 §5.2); solo de añadir
    # Una anotación de Gina por usuario del reparto antes de comparar: con la tabla vacía la prueba no demostraría nada. El seed solo conoce al dueño;
    # a Gina la localiza por el sufijo único del reparto (alicia.<sufijo>@example.test -> gina.<sufijo>@example.test).
    seed: >-
      insert into public.gestor_notes (owner_id, gestor_id, body)
      select %(owner)s, g.id, 'Anotación de matriz'
        from public.profiles o
        join public.profiles g on g.email = 'gina.' || substring(o.email from '\.([0-9a-f]{10})@') || '@example.test'
       where o.id = %(owner)s
    probe_insert: "insert into public.gestor_notes (owner_id, gestor_id, body) values (%(owner)s, %(owner)s, 'probe')"
    probe_update: { column: body, value: hacked }
    select:
      # El dueño ve las de su cuenta; el gestor, solo las suyas y solo con vínculo activo (revocado, ninguna); el administrador, ninguna (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  reminder_settings:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.set_reminder_settings (SPEC-W-014 §5.2)
    # Los ajustes de cada usuario del reparto antes de comparar: con la tabla vacía la prueba no demostraría nada.
    seed: >-
      insert into public.reminder_settings (owner_id, enabled, lead_days) values (%(owner)s, true, 7)
    probe_insert: "insert into public.reminder_settings (owner_id, lead_days) values (%(owner)s, 5)"
    probe_update: { column: lead_days, value: "5" }
    select:
      # Solo el dueño ve los suyos; el gestor, nunca (ni con vínculo activo), y el administrador, ninguno (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }

  reminder_log:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por private.reminder_claim / reminder_mark, solo para service_role (SPEC-W-014 §5.2)
    seed: >-
      insert into public.reminder_log (owner_id, period, kind, status, sent_at)
      values (%(owner)s, '2026-Q4', 'quarter_deadline', 'sent', now())
    probe_insert: "insert into public.reminder_log (owner_id, period, kind) values (%(owner)s, '2027-Q1', 'quarter_deadline')"
    probe_update: { column: kind, value: hacked }
    select:
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }

  monthly_closings:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por private.close_month, solo para service_role (SPEC-W-012 §5.2)
    # Un cierre sintético y coherente por usuario del reparto antes de comparar: con la tabla vacía la prueba no demostraría nada.
    seed: >-
      insert into public.monthly_closings (owner_id, year, month, invoice_count, national_cents, eu_cents, non_eu_cents, total_cents, expenses_cents, by_client)
      values (%(owner)s, 2026, 9, 1, 100000, 0, 0, 100000, 25000,
              '[{"client_id": "00000000-0000-4000-8000-000000000001", "name": "Matriz S.L.", "scope": "national", "base_cents": 100000, "invoice_count": 1}]')
    probe_insert: "insert into public.monthly_closings (owner_id, year, month, invoice_count, national_cents, eu_cents, non_eu_cents, total_cents, expenses_cents) values (%(owner)s, 2026, 10, 0, 0, 0, 0, 0, 0)"
    probe_update: { column: expenses_cents, value: "1" }
    select:
      # El dueño ve los suyos; el gestor, solo los de quien le dio acceso activo (revocado, pendiente o rechazado, ninguno); el administrador, ninguno (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  invoices:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # toda escritura pasa por app.*; una factura emitida no se edita ni se borra (SPEC-W-007 §5.2, RES-03)
    # Una factura por usuario del reparto antes de comparar (con su serie y su cliente): con la tabla vacía la prueba no demostraría nada.
    seed: >-
      with s as (insert into public.invoice_series (owner_id, code) values (%(owner)s, 'MXI') returning id),
           c as (insert into public.clients (owner_id, name, kind, country, scope, address)
                 values (%(owner)s, 'Matriz S.L.', 'business', 'ES', 'national', 'Calle Matriz 1, Madrid') returning id)
      insert into public.invoices (owner_id, series_id, series_code, number, kind, issue_date, client_id, client_name, client_kind,
                                   client_country, client_scope, client_address, issuer_name, issuer_tax_id, issuer_address, concept,
                                   tax_treatment, base_cents, total_cents)
      select %(owner)s, s.id, 'MXI', 1, 'standard', date '2026-01-02', c.id, 'Matriz S.L.', 'business', 'ES', 'national',
             'Calle Matriz 1, Madrid', 'Emisor Matriz', '12345678Z', 'Calle Emisor 1, Madrid', 'Concepto de la matriz',
             'national_vat', 1000, 1000
        from s, c
    probe_insert: >-
      insert into public.invoices (owner_id, series_id, series_code, number, kind, issue_date, client_id, client_name, client_kind,
                                   client_country, client_scope, client_address, issuer_name, issuer_tax_id, issuer_address, concept,
                                   tax_treatment, base_cents, total_cents)
      select owner_id, series_id, series_code, 2, kind, issue_date, client_id, client_name, client_kind, client_country, client_scope,
             client_address, issuer_name, issuer_tax_id, issuer_address, concept, tax_treatment, base_cents, total_cents
        from public.invoices where owner_id = %(owner)s
    probe_update: { column: concept, value: hacked }
    select:
      # El dueño ve las suyas; el gestor, solo las de quien le dio acceso activo; el administrador, ninguna (D3).
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }

  invoice_files:
    kind: financial
    owner_column: owner_id
    grants:
      table: [SELECT]       # solo las funciones la escriben, una vez por factura (SPEC-W-007 §5.2)
    seed: >-
      with s as (insert into public.invoice_series (owner_id, code) values (%(owner)s, 'MXF') returning id),
           c as (insert into public.clients (owner_id, name, kind, country, scope, address)
                 values (%(owner)s, 'Matriz S.L.', 'business', 'ES', 'national', 'Calle Matriz 1, Madrid') returning id),
           i as (insert into public.invoices (owner_id, series_id, series_code, number, kind, issue_date, client_id, client_name,
                                              client_kind, client_country, client_scope, client_address, issuer_name, issuer_tax_id,
                                              issuer_address, concept, tax_treatment, base_cents, total_cents)
                 select %(owner)s, s.id, 'MXF', 1, 'standard', date '2026-01-02', c.id, 'Matriz S.L.', 'business', 'ES', 'national',
                        'Calle Matriz 1, Madrid', 'Emisor Matriz', '12345678Z', 'Calle Emisor 1, Madrid', 'Concepto de la matriz',
                        'national_vat', 1000, 1000
                   from s, c
                 returning id)
      insert into public.invoice_files (invoice_id, owner_id, storage_path, sha256, size_bytes)
      select i.id, %(owner)s, %(owner)s::text || '/' || i.id::text || '-' || repeat('a', 16) || '.pdf', repeat('a', 64), 100 from i
    probe_insert: >-
      insert into public.invoice_files (invoice_id, owner_id, storage_path, sha256, size_bytes)
      select id, owner_id, owner_id::text || '/' || id::text || '-' || repeat('b', 16) || '.pdf', repeat('b', 64), 100
        from public.invoices where owner_id = %(owner)s
    probe_update: { column: size_bytes, value: "7" }
    select:
      default: { alicia: [alicia], beto: [beto], gina: [], gus: [], adan: [] }
      active: { gina: [alicia] }
