[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuadre-contracts"
version = "1.0.0"
description = "Modelos Pydantic de los contratos web <-> agentes de Cuadre"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3"]

[tool.setuptools]
packages = ["cuadre_contracts"]
