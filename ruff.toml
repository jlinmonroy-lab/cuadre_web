# Configuración de ruff compartida por backend/ y contracts/ (se ejecuta desde la raíz).
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "node_modules", "frontend"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 fuera: `ruff format` ya parte el código a 120 columnas y los comentarios/docstrings en español pueden pasarse un poco.
ignore = ["E501"]

[lint.isort]
known-first-party = ["cuadre", "cuadre_contracts"]
